name: Test and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      probe_installer:
        description: '仅诊断已发布1.1.1的全新双击安装，不构建或发布'
        required: false
        type: boolean
        default: false
      release_version:
        description: '发布版本号，如v1.1.0；留空只构建验证，不发布'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  installer_probe:
    if: inputs.probe_installer == true
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe published MSI without command-line overrides
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python -m pip install "Pillow>=10,<13"
          gh release download v1.1.1 --repo "${{ github.repository }}" --pattern '*setup.msi' --dir probe
          $msi=(Get-ChildItem probe/*.msi | Select-Object -First 1).FullName
          $app=Join-Path $env:LOCALAPPDATA 'Programs/JunZhenMatch'
          $data=Join-Path $env:USERPROFILE 'JunZhenMatch'
          python tools/verify_installer_ui.py --msi $msi --app $app --data $data --log "$pwd/probe/install.log" --no-properties
          Write-Host "UI test exit: $LASTEXITCODE; EXE exists: $(Test-Path (Join-Path $app 'JunZhengMatch.exe'))"
          Get-Content probe/install.log | Select-String -Pattern 'Feature:','Component: AppFiles','2753','ConfigureStorage','ADDLOCAL','INSTALLLEVEL'
          Start-Process msiexec.exe -ArgumentList @('/x',('"'+$msi+'"'),'/qn','/norestart') -Wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-probe
          path: probe/*.log
  test:
    if: inputs.probe_installer != true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python tools/build_version.py --version "${RELEASE_VERSION:-}"
      - run: pip install -r packaging/requirements-dev.txt
      - run: python tools/run_tests.py --report tests-report.json
      - run: python packaging/launcher.py --self-test --report self-test.json
      - run: python tools/privacy_check.py
      - run: python tools/verify_app.py --report http-self-test.json
        env:
          PYTHONIOENCODING: ascii
      - run: python tools/verify_runtime.py --report runtime-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: checks
          path: |
            *-test.json
            tests-report.json
  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.test.outputs.version }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r packaging/requirements-dev.txt
      - run: python tools/build_version.py --version "v$env:APP_VERSION"
      - run: pyinstaller --clean --noconfirm packaging/JunZhengMatch.spec
      - run: python tools/verify_icon.py --exe dist/JunZhengMatch.exe --report exe-icon-test.json
      - name: Verify frozen application
        shell: pwsh
        run: |
          $process=Start-Process dist/JunZhengMatch.exe -ArgumentList '--self-test','--report','exe-self-test.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'EXE self-test failed' }
          if ((Get-Content exe-self-test.json | ConvertFrom-Json).status -ne 'ok') { throw 'Invalid EXE report' }
      - run: python tools/verify_app.py --exe dist/JunZhengMatch.exe --report exe-http-test.json
      - run: python tools/verify_preview_ui.py --exe dist/JunZhengMatch.exe --report preview-ui-test.json
      - run: python tools/verify_setup_progress.py
      - run: python tools/verify_installer_errors.py --exe dist/JunZhengMatch.exe --report installer-error-handling-test.json
      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile dist/MicrosoftEdgeWebview2Setup.exe
          $signature=Get-AuthenticodeSignature dist/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'WebView2 signature validation failed' }
          $env:JZ_CONFIG_DIR=Join-Path $env:RUNNER_TEMP 'jz-desktop-prereq-config'
          $process=Start-Process dist/JunZhengMatch.exe -ArgumentList '--configure-data',"$env:RUNNER_TEMP\jz-desktop-prereq",'--ensure-webview2','--no-open' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'WebView2 setup failed' }
      - name: Build per-user MSI
        shell: pwsh
        run: |
          python tools/render_installer_background.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer background render failed' }
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && cl /nologo /LD /MT /O2 /utf-8 /std:c17 /D_WIN32_WINNT=0x0601 packaging\windows\installer_activity.c /Fo:build\InstallerUi.obj /link /OUT:build\InstallerUi.dll /IMPLIB:build\InstallerUi.lib msi.lib user32.lib gdi32.lib shell32.lib advapi32.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Installer UI helper build failed' }
          cmd /c "`"$vcvars`" >nul && cl /nologo /LD /MT /O2 /utf-8 tools\installer_error_fixture.c /Fo:build\InstallerErrorFixture.obj /link /OUT:build\InstallerErrorFixture.dll /IMPLIB:build\InstallerErrorFixture.lib msi.lib"
          if ($LASTEXITCODE -ne 0) { throw 'MSI error fixture build failed' }
          python tools/verify_rollback_access.py
          if ($LASTEXITCODE -ne 0) { throw 'Rollback permission guard test failed' }
          cmd /c "`"$vcvars`" >nul && cl /nologo /MT /O2 /utf-8 packaging\windows\maintenance_host.c /Fo:build\MaintenanceHost.obj /link /OUT:build\MaintenanceHost.exe /SUBSYSTEM:WINDOWS msi.lib user32.lib advapi32.lib shell32.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance host build failed' }
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/installer.wxs -arch x64 -d "Version=$env:APP_VERSION" -d "UiHelperPath=$((Resolve-Path build/InstallerUi.dll).Path)" -d "AppPath=$((Resolve-Path dist/JunZhengMatch.exe).Path)" -d "BootstrapperPath=$((Resolve-Path dist/MicrosoftEdgeWebview2Setup.exe).Path)" -d "IconPath=$((Resolve-Path assets/app.ico).Path)" -o "dist/JunZhengMatch-$env:APP_VERSION-windows-x64-setup.msi"
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
          wix build packaging/windows/installer.wxs -arch x64 -d "Version=99.0.0" -d "UiHelperPath=$((Resolve-Path build/InstallerUi.dll).Path)" -d "AppPath=$((Resolve-Path dist/JunZhengMatch.exe).Path)" -d "BootstrapperPath=$((Resolve-Path dist/MicrosoftEdgeWebview2Setup.exe).Path)" -d "IconPath=$((Resolve-Path assets/app.ico).Path)" -o "build/newer-version-fixture.msi"
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
          wix msi validate "dist/JunZhengMatch-$env:APP_VERSION-windows-x64-setup.msi" -sice ICE20
      - name: Install, verify and uninstall MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.1 --repo "${{ github.repository }}" --pattern '*setup.msi' --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download upgrade baseline' }
          $previous=(Get-ChildItem previous/*.msi | Select-Object -First 1).FullName
          gh release download v1.2.1 --repo "${{ github.repository }}" --pattern '*setup.msi' --dir current
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download current installed baseline' }
          $current=(Get-ChildItem current/*.msi | Select-Object -First 1).FullName
          ./tools/verify_installer.ps1 -Msi "dist/JunZhengMatch-$env:APP_VERSION-windows-x64-setup.msi" -PreviousMsi $previous -FutureMsi build/newer-version-fixture.msi -CurrentMsi $current -Report installer-test.json
      - name: Verify standard-account maintenance and same-user admin retry on isolated volume
        shell: pwsh
        run: |
          python tools/verify_restricted_maintenance.py --msi "dist/JunZhengMatch-$env:APP_VERSION-windows-x64-setup.msi"
          if ($LASTEXITCODE -ne 0) { throw 'Restricted-token maintenance failed' }
      - run: python tools/verify_runtime.py --exe dist/JunZhengMatch.exe --desktop --report exe-runtime-test.json
      - uses: actions/download-artifact@v4
        with:
          name: checks
          path: checks
      - name: Package Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release,portable/verification | Out-Null
          Copy-Item dist/JunZhengMatch.exe portable/
          Copy-Item README.md,WINDOWS.md,ASSETS.md portable/
          Copy-Item checks/*.json,*-test.json portable/verification/
          Compress-Archive -Path portable/* -DestinationPath "release/JunZhengMatch-$env:APP_VERSION-windows-x64-portable.zip"
          Copy-Item "dist/JunZhengMatch-$env:APP_VERSION-windows-x64-setup.msi" release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-preview
          path: installer-ui-preview/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-diagnostics
          path: |
            *-test.json
            dist/*.wixpdb
            installer-diagnostics/*.log
            installer-diagnostics/*.lnk
  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Docker image
        run: |
          docker build -t sjtu-junzhengmatch:$APP_VERSION .
          docker run --rm sjtu-junzhengmatch:$APP_VERSION python packaging/launcher.py --self-test --report /tmp/self-test.json
          docker run -d --name reviewer-smoke -e JZ_PASSWORD=synthetic-ci-password -p 127.0.0.1:8765:8765 sjtu-junzhengmatch:$APP_VERSION
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/health && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8765/health
          docker rm -f reviewer-smoke
          mkdir -p release
          docker save sjtu-junzhengmatch:$APP_VERSION | gzip > "release/JunZhengMatch-$APP_VERSION-docker-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: docker
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [test,windows,docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: docker
          path: release
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.test.outputs.tag }}
          APP_VERSION: ${{ needs.test.outputs.version }}
        run: |
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG")
          tag_exists=$(printf '%s' "$refs" | python -c 'import json,os,sys; print(any(r["ref"]=="refs/tags/"+os.environ["TAG"] for r in json.load(sys.stdin)))')
          if [ "$tag_exists" = "True" ]; then
            existing=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [ "$existing" != "$GITHUB_SHA" ]; then echo 'Version already belongs to another commit.'; exit 1; fi
          fi
          (cd release && sha256sum * > SHA256SUMS.txt)
          python tools/release_notes.py --version "$TAG" --output release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md --draft
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --notes-file release-notes.md --draft=false
