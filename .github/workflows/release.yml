name: Test and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "发布版本号，例如 v1.0.2；留空则只构建、不发布"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate optional release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python -c "import os,re; v=os.getenv('RELEASE_VERSION',''); assert not v or re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?',v), 'Version must look like v1.0.0'"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python entrypoint.py --self-test --report self-test.json
      - run: python tools/privacy_check.py
      - run: python tools/verify_app.py --report http-self-test.json
        env:
          PYTHONIOENCODING: ascii
  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --clean --noconfirm JunZhengMatch.spec
      - run: python tools/verify_icon.py --exe dist/JunZhengMatch.exe --report exe-icon-test.json
      - name: Verify native EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\JunZhengMatch.exe' -ArgumentList '--self-test','--report','exe-self-test.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE smoke test failed ($($p.ExitCode))" }
          if (!(Test-Path exe-self-test.json)) { throw 'EXE did not produce a smoke-test report' }
          $report = Get-Content exe-self-test.json | ConvertFrom-Json
          if ($report.status -ne 'ok' -or $report.reviewers -ne 18) { throw 'EXE verification failed' }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/JunZhengMatch.exe release/
          Copy-Item WINDOWS.md release/
          Copy-Item README.md,ARCHITECTURE.md,ASSETS.md,RELEASING.md release/
          Get-FileHash release/JunZhengMatch.exe -Algorithm SHA256 | Format-List | Out-File release/Windows-SHA256.txt
      - run: python tools/verify_app.py --exe dist/JunZhengMatch.exe --report exe-http-test.json
      - name: Package portable Windows download
        shell: pwsh
        run: |
          Copy-Item exe-self-test.json,exe-http-test.json,exe-icon-test.json release/
          Compress-Archive -Path release/* -DestinationPath release/SJTU-JunZhengMatch-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify container
        run: |
          docker build -t sjtu-junzhengmatch:release .
          docker run --rm sjtu-junzhengmatch:release python entrypoint.py --self-test --report /tmp/test.json
          docker run -d --name reviewer-smoke -e JZ_PASSWORD=synthetic-ci-password -p 127.0.0.1:8765:8765 sjtu-junzhengmatch:release
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/health && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8765/health
          docker rm -f reviewer-smoke
          mkdir -p release
          docker save sjtu-junzhengmatch:release | gzip > release/SJTU-JunZhengMatch-Docker.tar.gz
          cd release && sha256sum *.tar.gz > Docker-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_version || github.ref_name }}
        run: |
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG")
          tag_exists=$(printf '%s' "$refs" | python -c 'import json,os,sys; print(any(r["ref"] == "refs/tags/"+os.environ["TAG"] for r in json.load(sys.stdin)))')
          if [ "$tag_exists" = "True" ]; then
            existing=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [ "$existing" != "$GITHUB_SHA" ]; then echo "Version already points to another commit; choose a new version."; exit 1; fi
          fi
          (cd release && sha256sum *.exe *.zip *.tar.gz > SHA256SUMS.txt)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
