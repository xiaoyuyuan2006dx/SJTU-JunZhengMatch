<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:684px;overflow:hidden;background:#fff8f0}
body{background:radial-gradient(ellipse at 68% 0,#d9eee8,transparent 52%),radial-gradient(ellipse at 100% 85%,#f4cce2,transparent 46%),linear-gradient(130deg,#fff9eb,#fff0f2)}
.portrait{position:absolute;right:-5px;top:-30px;width:430px;height:755px;object-fit:cover;object-position:50% 34%;opacity:.8;mask-image:linear-gradient(90deg,transparent,#000 22%)}
.veil{position:absolute;inset:0;background:linear-gradient(0deg,#fff3ec,transparent 22%)}
.panel{position:absolute;left:20px;top:20px;width:824px;height:644px;overflow:hidden;border:1px solid #fff;border-radius:30px;background:#fffcf9;box-shadow:0 12px 40px #88647717,0 0 0 1px #d7c5d04d}
.header{position:absolute;inset:0 0 auto;height:145px;background:linear-gradient(110deg,#f1edf8,#fff1e6 58%,#e8f3ed)}
.header:after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:linear-gradient(90deg,#b5a3cf80,#edb6c66b,#b6d1c780)}
.accent{position:absolute;left:0;top:26px;width:5px;height:60px;background:linear-gradient(#b6a0cd,#e3b4c3);border-radius:0 6px 6px 0}
.footer{position:absolute;inset:auto 0 0;height:130px;background:linear-gradient(110deg,#f4f0f8b3,#fcf2eab3);border-top:1px solid #e9dfe780}
.circle{position:absolute;border:2px solid #ffffff80;border-radius:50%;width:310px;height:310px;right:-100px;top:-170px}
.circle.b{width:140px;height:140px;right:315px;top:500px;border-color:#ffffff70}
</style><img class="portrait" src="../../assets/installer-art.png"><div class="veil"></div><div class="circle"></div><div class="circle b"></div><div class="panel"><div class="header"></div><div class="accent"></div><div class="footer"></div></div>
